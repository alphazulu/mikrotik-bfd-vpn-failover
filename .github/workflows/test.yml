name: Test configurator

on:
  push:
    branches: ["main"]
    paths:
      - "configurator/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "configurator/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: node --check configurator/app.js

      - name: Unit and privacy tests
        run: node tests/configurator.mjs

      - name: Simulate generated monitor failover and failback
        run: node tests/monitor.mjs

      - name: Install config validators
        run: |
          sudo apt-get update
          sudo apt-get install -y bird2 wireguard-tools

      - name: Validate generated BIRD configs
        run: |
          bird -p -c tests/.generated/server1-bird.conf
          bird -p -c tests/.generated/server2-bird.conf
          bird -p -c tests/.generated/multi-server1-bird.conf
          bird -p -c tests/.generated/multi-server2-bird.conf

      - name: Validate generated WireGuard configs
        run: |
          wg-quick strip tests/.generated/server1-wg-exit.conf >/dev/null
          wg-quick strip tests/.generated/server2-wg-exit.conf >/dev/null
          wg-quick strip tests/.generated/server1-wg-in.conf >/dev/null
          cp tests/.generated/multi-server1-wg-exit2.conf /tmp/wgx2.conf
          wg-quick strip /tmp/wgx2.conf >/dev/null
          cp tests/.generated/multi-server2-wg-exit.conf /tmp/wgs2.conf
          wg-quick strip /tmp/wgs2.conf >/dev/null

      - name: Validate generated shell
        run: |
          bash -n tests/.generated/vpn-exit-monitor.sh
          bash -n tests/.generated/multi-vpn-exit-monitor.sh

      - name: Validate generated systemd units
        run: |
          systemd-analyze verify tests/.generated/vpn-failover-firewall.service
          systemd-analyze verify tests/.generated/awg-policy-routing.service
          systemd-analyze verify tests/.generated/multi-vpn-failover-firewall.service
